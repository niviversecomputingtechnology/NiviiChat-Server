version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - nivichat_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: sh -c "npx prisma db push && npx prisma db seed"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: npm run start # node dist/server.js (Fastify), port 3000
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - nivichat_uploads:/app/public/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  ws:
    build: .
    command: node ws-server.js # port 8080
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  nivichat_pgdata:
  nivichat_uploads:
